name: Update Griz HQ live scores

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-live-score-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber

      - name: Refresh Montana data
        run: python update_data.py

      - name: Refresh FCS and Big Sky scores
        run: python score_refresh.py

      - name: Commit changed data
        run: |
          git config user.name "griz-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json news.json social.json
          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Auto-update Griz HQ scores and data"
            git push
          fi
