name: Refresh Griz HQ data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber

      - name: Update Griz HQ data
        run: python update_data.py


      - name: Validate generated data
        run: python validate_stats.py

      - name: Commit updated data safely
        run: |
          set -e
          git config user.name "griz-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No Griz HQ data changes to commit."
            exit 0
          fi

          git commit -m "Auto-update Griz HQ data"
          git push origin HEAD:main
