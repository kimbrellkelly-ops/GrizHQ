name: Refresh Griz HQ data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber

      - name: Update Griz HQ data
        run: python update_data.py

      - name: Repair and refresh FCS scoreboard cache
        run: python score_refresh.py

      - name: Commit updated data
        run: |
          git config user.name "griz-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Auto-update Griz HQ data"
          git push
