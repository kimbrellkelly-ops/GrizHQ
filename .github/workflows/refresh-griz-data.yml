name: Refresh Griz HQ data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "refresh_player_stats.py"
      - "stats_safety.py"
      - "validate_stats.py"
      - ".github/workflows/refresh-griz-data.yml"

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber

      - name: Update Griz HQ data
        run: python update_data.py

      - name: Refresh official cumulative player stats
        run: python refresh_player_stats.py

      - name: Repair and refresh FCS scoreboard cache
        run: python score_refresh.py

      - name: Repair missing completed-game stats
        run: python repair_stats.py

      - name: Restore empty stats categories safely
        run: python stats_safety.py

      - name: Validate generated stats
        run: python validate_stats.py

      - name: Commit updated data safely
        run: |
          set -e
          git config user.name "griz-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python update_data.py
            python refresh_player_stats.py
            python score_refresh.py
            python repair_stats.py
            python stats_safety.py
            python validate_stats.py
            git add data.json

            if git diff --cached --quiet; then
              echo "No Griz HQ data changes to commit."
              exit 0
            fi

            git commit -m "Auto-update Griz HQ data"
            if git push origin HEAD:main; then
              echo "Updated Griz HQ data pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying from latest main."
            git reset --hard origin/main
          done

          echo "Unable to push refreshed Griz HQ data after 3 attempts."
          exit 1
