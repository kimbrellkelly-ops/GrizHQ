name: Refresh Griz HQ transfer stats (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  refresh-transfers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify transfer updater
        run: |
          test -f transfer_update_v2.py
          test -f transfer_stats.json
      - name: Install transfer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas lxml
      - name: Refresh transfer stats
        run: python transfer_update_v2.py
      - name: Validate changes
        run: |
          python -m py_compile transfer_update_v2.py
          git diff --check
          git diff --stat
      - name: Commit transfer changes only
        run: |
          git config user.name 'griz-hq-bot'
          git config user.email 'griz-hq-bot@users.noreply.github.com'
          git add index.html transfer_stats.json
          git diff --cached --quiet || git commit -m 'Refresh verified Griz transfer stats'
          git push origin HEAD:main
