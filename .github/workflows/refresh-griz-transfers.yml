name: Refresh Griz HQ transfer stats

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "transfer_stats.json"
      - "transfer_update_v2.py"
      - "index.html"
      - ".github/workflows/refresh-griz-transfers.yml"

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  refresh-transfers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify latest transfer updater
        run: |
          set -e
          echo "Checked out commit: $(git rev-parse HEAD)"
          test -f transfer_update_v2.py
          test -f transfer_stats.json
          grep -q "python transfer_update_v2.py" .github/workflows/refresh-griz-transfers.yml
          echo "Verified: workflow uses transfer_update_v2.py"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install transfer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas lxml

      - name: Refresh transfer stats
        shell: bash
        run: |
          set -o pipefail
          python transfer_update_v2.py 2>&1 | tee transfer-refresh.log
          grep -q "Rendered" transfer-refresh.log

      - name: Commit transfer stats only
        run: |
          git config user.name "griz-hq-transfers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No rendered transfer-card changes to commit."
            exit 0
          fi
          git commit -m "Render Griz transfer ledger changes"
          git pull --rebase origin main
          git push origin HEAD:main
