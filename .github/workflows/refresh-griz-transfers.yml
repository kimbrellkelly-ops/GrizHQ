name: Refresh Griz HQ transfer stats

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  refresh-transfers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install transfer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas lxml

      - name: Refresh transfer stats
        run: python transfer_update_v2.py

      - name: Commit transfer stats only
        run: |
          git config user.name "griz-hq-transfers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No transfer-stat changes to commit."
            exit 0
          fi
          git commit -m "Auto-update Griz transfer stats"
          git pull --rebase origin main
          git push origin HEAD:main
