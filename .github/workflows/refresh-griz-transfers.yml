name: Refresh Griz HQ transfer stats

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  refresh-transfers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify latest transfer updater
        run: |
          echo "Checked out commit: $(git rev-parse HEAD)"
          test -f transfer_update_v2.py
          ! grep -q "python transfer_update_v2.py" .github/workflows/refresh-griz-transfers.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install transfer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas lxml

      - name: Refresh transfer stats
        shell: bash
        run: |
          set -o pipefail
          python transfer_update_v2.py 2>&1 | tee transfer-refresh.log
          if grep -q "Transfer tracker: 0/" transfer-refresh.log; then
            echo "ERROR: The transfer scraper found zero matching player rows."
            exit 1
          fi

      - name: Commit transfer stats only
        run: |
          git config user.name "griz-hq-transfers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html transfer_stats.json
          if git diff --cached --quiet; then
            echo "No transfer-stat changes to commit."
            exit 0
          fi
          git commit -m "Auto-update Griz transfer stats"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed; retrying after refetch..."
            git rebase --abort || true
            git fetch origin main
          done
          echo "Unable to push refreshed Griz transfer stats after 3 attempts."
          exit 1
