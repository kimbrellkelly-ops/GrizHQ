name: Refresh Griz HQ Social

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  refresh-social:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install social dependencies
        run: pip install requests beautifulsoup4
      - name: Refresh social.json
        run: python social_update.py
      - name: Commit social.json only
        run: |
          git config user.name 'griz-hq-social-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social.json
          if git diff --cached --quiet; then
            echo "No social changes to commit."
            exit 0
          fi
          git commit -m 'Auto-update Griz HQ social'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed; retrying after refetch..."
            git rebase --abort || true
            git fetch origin main
          done
          echo "Unable to push refreshed Griz HQ social after 3 attempts."
          exit 1
