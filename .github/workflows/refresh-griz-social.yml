name: Refresh Griz Social

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Refresh social feed
        run: python social_update.py
      - name: Commit social feed
        run: |
          git config user.name "grizhq-bot"
          git config user.email "grizhq-bot@users.noreply.github.com"
          git add social.json
          git diff --cached --quiet || git commit -m "Refresh Griz social feed"
          git push
