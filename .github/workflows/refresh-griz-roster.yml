name: Refresh Griz Roster HQ (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  refresh-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify baseline
        run: |
          test -f roster_update.py
          test -f index.html
      - name: Refresh roster, verified photos and coaching staff
        run: python roster_update.py
      - name: Validate changed files
        run: |
          python -m py_compile roster_update.py
          git diff --check
          git diff --stat
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            echo "$changed" | grep -E '^(index\.html|roster_update\.py|\.github/workflows/refresh-griz-roster\.yml)$' >/dev/null || {
              echo 'Unexpected changed file detected'; exit 1;
            }
          fi
      - name: Commit roster changes only
        run: |
          git config user.name 'griz-hq-bot'
          git config user.email 'griz-hq-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh verified Griz roster data'
          git push origin HEAD:main
