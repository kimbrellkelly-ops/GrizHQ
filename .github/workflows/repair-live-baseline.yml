name: Repair live Griz HQ baseline

on:
  push:
    paths:
      - '.github/workflows/repair-live-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply only verified live-page repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'app.js?v=20260913-next-game-authoritative1': 'app.js?v=20260915-live-repair1',
              'app.js?v=20260907-top25-scorecards1': 'app.js?v=20260915-live-repair1',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Commit repair
        run: |
          git config user.name 'griz-hq-bot'
          git config user.email 'griz-hq-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Repair live production cache baseline'
          git push origin HEAD:main
