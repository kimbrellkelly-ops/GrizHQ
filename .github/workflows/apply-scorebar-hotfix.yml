name: Apply scorebar hotfix (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify baseline
        run: |
          git status --short
          test -f scorebar_hotfix.py
          test -f index.html
          test -f app.js
          test -f styles.css
      - name: Apply hotfix
        run: python scorebar_hotfix.py
      - name: Validate and show diff
        run: |
          python -m py_compile scorebar_hotfix.py
          git diff --check
          git diff --stat
      - name: Commit hotfix changes
        run: |
          git config user.name 'griz-hq-bot'
          git config user.email 'griz-hq-bot@users.noreply.github.com'
          git add index.html app.js styles.css
          git diff --cached --quiet || git commit -m 'Apply verified scorebar fix'
          git push origin HEAD:main
