name: Refresh Griz HQ Scoreboards
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: griz-hq-scoreboards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python refresh_scoreboards.py --self-test
      - run: python refresh_scoreboards.py
      - name: Validate generated cache
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          d=json.loads(Path('scoreboard/scoreboard-data.json').read_text())
          assert len(d.get('rankings',[])) >= 25, 'rankings missing'
          assert len(d.get('weeks',[])) == 13, 'week count invalid'
          assert all('fcsEventCount' in w and 'bigSkyEventCount' in w and 'fcsTop25Games' in w for w in d['weeks']), 'week schema invalid'
          for w in d['weeks']:
              for section in ('fcsTop25Games','bigSkyGames'):
                  ids=[str(g['id']) for g in w.get(section,[]) if g.get('id') is not None]
                  assert len(ids) == len(set(ids)), f'duplicate game IDs in {section} for {w.get("label")}'

          now=datetime.now(timezone.utc)
          today=now.date().isoformat()
          current=next((w for w in d['weeks'] if w['start'] <= today <= w['end']), None)
          assert current is not None, f'No cache week covers {today}'

          games=current.get('fcsTop25Games',[])
          scored=sum(1 for g in games if len(g.get('teams',[])) >= 2 and all(str(t.get('score','')).isdigit() for t in g['teams']))

          print('CACHE VALIDATION PASSED')
          print('Generated:', d.get('generatedAt'))
          print('Current week:', current['label'])
          print('FCS events:', current.get('fcsEventCount'))
          print('Ranked games:', len(games))
          print('Scored ranked games:', scored)
          print('Big Sky events:', current.get('bigSkyEventCount'))

          # On Saturday/Sunday after the slate is underway, do not publish a
          # structurally valid but scoreless cache.
          if now.weekday() in (5,6) and now.hour >= 20:
              assert scored > 0, 'Current-week cache has no scored FCS games after the slate should have started'
          PY
      - name: Commit generated cache
        run: |
          git config user.name "griz-hq-scoreboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard/scoreboard-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh verified FCS and Big Sky scoreboard cache"
          git push
