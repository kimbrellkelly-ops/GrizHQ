name: Refresh Griz HQ Scoreboards
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: griz-hq-scoreboards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python refresh_scoreboards.py --self-test
      - run: python refresh_scoreboards.py
      - name: Validate generated cache
        run: python -c "import json; from pathlib import Path; d=json.loads(Path('scoreboard/scoreboard-data.json').read_text()); assert len(d.get('rankings',[]))>=25, 'rankings missing'; assert len(d.get('weeks',[]))==13, 'week count invalid'; assert all('fcsEventCount' in w and 'bigSkyEventCount' in w and 'fcsTop25Games' in w for w in d['weeks']), 'week schema invalid'; print('CACHE VALIDATION PASSED'); print('Weeks:',len(d['weeks']),'Rankings:',len(d['rankings'])); print('FCS events:',sum(w['fcsEventCount'] for w in d['weeks']),'Big Sky events:',sum(w['bigSkyEventCount'] for w in d['weeks']),'Ranked games:',sum(len(w['fcsTop25Games']) for w in d['weeks']))"
      - name: Commit generated cache
        run: |
          git config user.name "griz-hq-scoreboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard/scoreboard-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh verified FCS and Big Sky scoreboard cache"
          git push
