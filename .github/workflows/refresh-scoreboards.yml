name: Refresh Griz HQ Scoreboards
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: griz-hq-repo-writes
  cancel-in-progress: false
jobs:
  refresh-scoreboards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install scoreboard dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Validate scoreboard code
        run: python refresh_scoreboards.py --self-test
      - name: Build verified ESPN scoreboard cache
        run: python refresh_scoreboards.py
      - name: Validate generated cache
        run: >-
          python -c "import json; from pathlib import Path; d=json.loads(Path('scoreboard/scoreboard-data.json').read_text()); assert len(d.get('rankings',[]))>=25; assert len(d.get('weeks',[]))==13; assert all(w.get('complete') and w.get('fcsEventCount',0)>0 and w.get('bigSkyEventCount',0)>0 for w in d['weeks']); print('Verified scoreboard cache: 13 weeks')"
      - name: Commit scoreboard cache
        run: |
          set -e
          git config user.name "griz-hq-scoreboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard/scoreboard-data.json
          if git diff --cached --quiet; then
            echo "No scoreboard cache changes."
            exit 0
          fi
          git commit -m "Refresh FCS and Big Sky scoreboard cache"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            git fetch origin main
            sleep 2
          done
          echo "Unable to push scoreboard cache after 3 attempts."
          exit 1
