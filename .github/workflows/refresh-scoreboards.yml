name: Refresh Griz HQ Scoreboards
on:
  push:
    paths:
      - "refresh_scoreboards.py"
      - "scoreboard/**"
      - ".github/workflows/refresh-scoreboards.yml"
      - "data.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: griz-hq-scoreboards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python refresh_scoreboards.py --self-test
      - run: python refresh_scoreboards.py
      - name: Commit cache
        run: |
          set -e
          git config user.name "griz-hq-scoreboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard/scoreboard-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh FCS and Big Sky scoreboard cache"
          git push origin HEAD:main
